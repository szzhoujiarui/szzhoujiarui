<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Zhou J. developer portfolio</title>
  <desc id="description">Python automation, data systems, integrations, and practical business tools.</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="1220" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0B1C31"/>
      <stop offset="1" stop-color="#10243B"/>
    </linearGradient>
    <linearGradient id="accent" x1="92" y1="76" x2="448" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D7E4"/>
      <stop offset="1" stop-color="#57F2B2"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#B7D8F5" stroke-opacity="0.055"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#35D7E4"/><stop offset="1" stop-color="#57F2B2"/></linearGradient>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#background)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1150" cy="36" r="150" fill="#35D7E4" fill-opacity="0.045"/>
  <circle cx="784" cy="348" r="120" fill="#57F2B2" fill-opacity="0.035"/>

  <rect x="72" y="64" width="6" height="230" rx="3" fill="url(#accent)"/>
  <text x="108" y="86" fill="#57F2B2" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="600" letter-spacing="2.4">AUTOMATION ENGINEER / PORTFOLIO 2026</text>
  <text x="106" y="166" fill="#F4F9FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="5">ZHOU J.</text>
  <text x="108" y="215" fill="#8FDDE4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" letter-spacing="1.2">PYTHON AUTOMATION &amp; DATA SYSTEMS</text>
  <text x="108" y="256" fill="#C8DAEA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">Reliable workflows for data, integrations,</text>
  <text x="108" y="286" fill="#C8DAEA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">and business operations.</text>

  <path d="M720 64V296" stroke="#31506B" stroke-dasharray="4 10"/>
  <text x="772" y="86" fill="#6F92AD" font-family="Consolas, Menlo, monospace" font-size="15" letter-spacing="2">SYSTEM DESIGN / 01</text>
  <path d="M800 136V254" stroke="url(#line)" stroke-width="2"/>
  <circle cx="800" cy="138" r="8" fill="#07111F" stroke="#35D7E4" stroke-width="3"/>
  <circle cx="800" cy="196" r="8" fill="#07111F" stroke="#35D7E4" stroke-width="3"/>
  <circle cx="800" cy="254" r="8" fill="#07111F" stroke="#57F2B2" stroke-width="3"/>
  <text x="836" y="144" fill="#F4F9FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Structure inputs</text>
  <text x="836" y="202" fill="#F4F9FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Verify transitions</text>
  <text x="836" y="260" fill="#F4F9FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Automate recovery</text>
  <text x="836" y="169" fill="#7898B1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">schemas / contracts / provenance</text>
  <text x="836" y="227" fill="#7898B1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">validation / idempotency / audit</text>
  <text x="836" y="285" fill="#7898B1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">retries / replay / observability</text>

  <rect x="0.5" y="0.5" width="1279" height="359" rx="23.5" stroke="#31506B" stroke-opacity="0.72"/>
</svg>
