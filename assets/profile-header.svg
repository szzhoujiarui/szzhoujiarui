<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Zhou J. developer profile</title>
  <desc id="description">A restrained editorial profile for a Chinese open-source developer focused on reliable systems.</desc>
  <style>
    .surface { fill: #F8F8F5; }
    .ink { fill: #151716; }
    .ink-soft { fill: #555A56; }
    .rule { stroke: #CFD2CD; }
    .accent { fill: #B43B2E; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #0D1110; }
      .ink { fill: #F1F1EC; }
      .ink-soft { fill: #A7ACA7; }
      .rule { stroke: #353A36; }
      .accent { fill: #D65B49; }
    }
  </style>

  <rect class="surface" width="1280" height="360"/>
  <rect class="accent" x="64" y="52" width="4" height="256"/>
  <path class="rule" d="M92 52H1216M92 308H1216M770 84V276"/>

  <text class="ink-soft" x="94" y="82" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="3.4">PROFILE / 2026</text>
  <text class="ink" x="89" y="189" font-family="Arial, Helvetica, sans-serif" font-size="94" font-weight="700" letter-spacing="-4">ZHOU J.</text>
  <text class="ink" x="94" y="229" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" letter-spacing="1.8">RELIABLE SYSTEMS. CLEAR EVIDENCE.</text>
  <text class="ink-soft" x="94" y="268" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="500" letter-spacing="5">求真 / 务实 / 开源</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <text class="accent" x="818" y="111" font-size="12" font-weight="700" letter-spacing="2">01</text>
    <text class="ink" x="870" y="111" font-size="17" font-weight="600" letter-spacing="1.2">PYTHON SYSTEMS</text>
    <path class="rule" d="M818 132H1188"/>

    <text class="accent" x="818" y="176" font-size="12" font-weight="700" letter-spacing="2">02</text>
    <text class="ink" x="870" y="176" font-size="17" font-weight="600" letter-spacing="1.2">DATA WORKFLOWS</text>
    <path class="rule" d="M818 197H1188"/>

    <text class="accent" x="818" y="241" font-size="12" font-weight="700" letter-spacing="2">03</text>
    <text class="ink" x="870" y="241" font-size="17" font-weight="600" letter-spacing="1.2">AGENT INTEGRATIONS</text>
    <path class="rule" d="M818 262H1188"/>
  </g>

  <text class="ink-soft" x="94" y="335" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" letter-spacing="2.5">CHINESE DEVELOPER · OPEN-SOURCE CONTRIBUTOR</text>
  <text class="accent" x="1216" y="335" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">CN / ZJ</text>
