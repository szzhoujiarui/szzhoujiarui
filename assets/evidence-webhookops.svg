<svg width="1280" height="250" viewBox="0 0 1280 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">WebhookOps Reliability Console</title><desc id="description">A reliable webhook pipeline with verification, retries, dead-letter handling, replay, and audit records.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1280" y2="250" gradientUnits="userSpaceOnUse"><stop stop-color="#07111F"/><stop offset="1" stop-color="#10243B"/></linearGradient></defs>
  <rect width="1280" height="250" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1278" height="248" rx="21" stroke="#31506B"/>
  <text x="54" y="56" fill="#35D7E4" font-family="Consolas, Menlo, monospace" font-size="16" font-weight="600" letter-spacing="2">FEATURED SYSTEM / 02</text>
  <text x="54" y="112" fill="#F4F9FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">WebhookOps Reliability Console</text>
  <text x="54" y="154" fill="#A9C1D6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">Make asynchronous delivery failures visible and recoverable.</text>
  <text x="54" y="202" fill="#6F92AD" font-family="Consolas, Menlo, monospace" font-size="16">FASTAPI  /  REACT  /  TYPESCRIPT  /  SQLITE</text>
